<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Arial, Helvetica, sans-serif">
<title>SDN intrusion detection architecture</title>
<desc>Ryu controller above an Open vSwitch switch connected to four hosts. New connections go up as packet-in, drop rules come down as flow-mod.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="380" fill="#ffffff"/>
<rect x="170" y="30" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Ryu controller (ids.py)</text>
<text x="340" y="72" text-anchor="middle" font-size="12" fill="#0F6E56">Rules R1, R2, R3 and block</text>
<line x1="290" y1="168" x2="290" y2="90" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="390" y1="90" x2="390" y2="166" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<text x="282" y="134" text-anchor="end" font-size="12" fill="#444441">packet-in: new SYN</text>
<text x="398" y="134" text-anchor="start" font-size="12" fill="#444441">flow-mod: drop rule</text>
<rect x="60" y="170" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Open vSwitch s1 (OpenFlow 1.3)</text>
<text x="340" y="212" text-anchor="middle" font-size="12" fill="#0F6E56">Flow priorities 0 / 10 / 100</text>
<g stroke="#444441" stroke-width="1.5"><line x1="115" y1="226" x2="115" y2="288"/><line x1="265" y1="226" x2="265" y2="288"/><line x1="415" y1="226" x2="415" y2="288"/><line x1="565" y1="226" x2="565" y2="288"/></g>
<rect x="50" y="290" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="115" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">h1 attacker</text><text x="115" y="332" text-anchor="middle" font-size="12" fill="#993C1D">10.0.0.1</text>
<rect x="200" y="290" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="265" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">h2 client</text><text x="265" y="332" text-anchor="middle" font-size="12" fill="#5F5E5A">10.0.0.2</text>
<rect x="350" y="290" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="415" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">h3 TCP server</text><text x="415" y="332" text-anchor="middle" font-size="12" fill="#5F5E5A">10.0.0.3</text>
<rect x="500" y="290" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="565" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">h4 attacker 2</text><text x="565" y="332" text-anchor="middle" font-size="12" fill="#993C1D">Demo 2, unused now</text>
</svg>
